[project]
name = "cold-control"
version = "0.1.0"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade (modernization)
    "B",   # flake8-bugbear (logic guardrails)
    "N",   # pep8-naming
    "I",   # import sorting
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP007", # Allow Union for 3.9 compatibility
    "UP045", # Allow Optional for 3.9 compatibility
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"instruments/ThorlabsPM100/ThorlabsPM100.py" = ["N801", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
include = ["."] # Adjust "src" to your actual source folder name
exclude = ["**/node_modules",
    "**/__pycache__",
    ".venv",
    "**/.*",
    "**/dlls",
    "**/icons",
    "**/labbook",
    "**/measurements",
    "**/temp"]

venvPath = "C:\\Users\\kingm\\.conda\\envs"
venv = "cold-control"

pythonVersion = "3.9"
typeCheckingMode = "standard" # Options: "off", "basic", "standard", "strict"

# Specific Rule Overrides
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false

# Diagnostic settings to match your Ruff style
reportUnusedImport = "warning"
reportUnusedVariable = "warning"