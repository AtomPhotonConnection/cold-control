date = 02/02/2026
time = 17:05
notes = "Experiment config for pulse shaping experiment without camera. Oscilloscope data channels: [[data_channels]] sets voltage range (min, max) per channel; [[data_channel_impedance]] = high or low (1 MOhm or 50 Ohm); [[data_channel_coupling]] = AC or DC. Ensure the trigger channel range includes both trigger levels."

save location = "C:\pulse_shaping_data"
mot reload = 1000
iterations = 7

use_cam = False
use_scope = True
use_awg = True

[scope_settings]
trigger_channel = 1
trigger_level = 1.0
sample_rate = 50e6
time_range = -100e-6, 4.1e-3
[[data_channels]]
1 = -1.0, 5.0
2 = -0.1, 0.1
3 = -0.004, 0.008
[[data_channel_impedance]]
1 = high
2 = high
3 = high
[[data_channel_coupling]]
1 = DC
2 = DC
3 = DC

[awg_settings]
config_path = "configs\pulse_shaping_expt\awg_configs\feb26_awg_updated.ini"

[metadata]
config_type = experiment
experiment_type = "MOT Fluorescence"