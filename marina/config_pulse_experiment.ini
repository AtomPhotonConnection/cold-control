# Pulse Shape Experiment Configuration
#
# Used by PulseShapeConfig (pulse_experiment.py) to set up AWG + oscilloscope
# experiments.  Copy this file and adjust the values for your setup.
#
# Usage:
#   from pulse_experiment import PulseShapeConfig
#   cfg = PulseShapeConfig("config_pulse_experiment.ini")

[Hardware]
# Agilent Infiniium 9000 Series oscilloscope VISA resource ID
scope_id = USB0::0x2A8D::0x900E::MY53450121::0::INSTR

# AWG VISA resource ID
awg_id = USB0::0x168C::0x1284::0000215582::0::INSTR


[Pulse_paths]
# Paths to theoretical pulse-shape CSVs (headerless, values in first row)
stokes = waveforms\pulse_shaping_exp\stirap\standard_200ns_stokes.csv
pump = waveforms\pulse_shaping_exp\stirap\standard_200ns_pump.csv
optical_pumping = waveforms\new_Jan\tophat\tophat_1000ns.csv

[Channel]
# AWG output channel (1-4)
channel = 1

# Pulse type — must match a key in [Pulse_paths]
pulse_type = pump


[Optimization]
# Signal amplitude (normalised 0-1)
amplitude = 0.3

# --- Iterative feedback ---
max_iterations = 10
error_threshold = 1e-4
gain = 0.5

# --- M-LOOP Bayesian optimisation ---
max_num_runs = 100
num_fourier_coeffs = 15

# --- Memory polynomial predistortion ---
poly_degree = 5
mem_depth = 3


[Oscilloscope]
# Trigger settings
trigger_channel = 1
trigger_level = 150e-3

# Sampling rate (Hz)
samp_rate = 20e9

# Timebase range (start, stop) in seconds
timebase_start = -200e-9
timebase_stop = 200e-9

# Vertical range per scope channel (volts)
channel_1_lower = -0.5
channel_1_upper = 3.0


[Measurement]
# Number of hardware averages per acquisition
num_measurements = 1000

# Delay before trigger (seconds)
trigger_delay = 0


[Paths]
# Base output directory — a timestamped subdirectory (yyyy-mm-dd/HH-MM/)
# will be appended automatically
output_dir = C:\pulse_shaping_data\optimisation_results

# Path to AWG configuration file (ConfigObj .ini format)
config_awg_path = .\configs\pulse_shaping_expt\awg_configs\feb26_optimisation_config.ini

# Optional: path to save an optimised waveform CSV
save_optimized_to = C:\pulse_shaping_data\optimisation_results\optimized_waveform.csv
