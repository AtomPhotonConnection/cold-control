# AWG Pulse Optimization Configuration - Inverted Approach
# 
# This configuration file sets up parameters for the inverted optimization approach:
# 1. Send theoretical signal to AWG
# 2. Measure scope response
# 3. Use NLMS (inverted) to find what input would produce desired output
# 4. Send optimized input → should produce desired output
#
# Usage:
#   python optimize_awg_pulse_inverted.py
#   Then edit this file with your hardware settings

[Hardware]
# Agilent Infiniium 9000 Series oscilloscope resource ID
# Use visa.list_resources() to find your specific address
# Format: USB0::0x2A8D::0x900E::<SERIAL>::0::INSTR
scope_id = USB0::0x2A8D::0x900E::MY53450121::0::INSTR

# AWG resource ID (if needed)
awg_id = USB0::0x168C::0x1284::0000215582::0::INSTR


[Pulse_paths]
# Path to theoretical pulse shape (CSV format, time vs voltage)
stokes = waveforms\pulse_shaping_exp\stirap\standard_200ns_stokes.csv
pump = waveforms\pulse_shaping_exp\stirap\standard_200ns_pump.csv
optical_pumping = waveforms\new_Jan\tophat\tophat_1000ns.csv

[Channel]
# AWG output channel (1-4)
# 1: EYLSA, Pump pulse (STIRAP)
# 2: DLPro, Stokes pulse (STIRAP) and optical pumping pulse
# 3: EYLSA, optical pumping pulse
# 4: Unused
channel = 1

# Pulse type (must match channel):
# stokes, pump, P1, P2
pulse_type = pump


[Optimization]
# Signal amplitude (normalized 0-1)
amplitude = 0.3


# NLMS window size search range
window_min = 10
window_max = 70
window_step = 10

# Learning rate (mu) search range
mu_min = 0.1
mu_max = 10
mu_pts = 10

method = multi_pass # wiener or multi_pass
n_passes = 10 # Only used for multi_pass method



[Oscilloscope]
# Trigger channel
trigger_channel = 1

# Trigger level (volts)
trigger_level = 150e-3

# Sampling rate (Hz)
samp_rate = 1e9

# Timebase range (start, stop) in seconds
timebase_start = -500e-9
timebase_stop = 500e-9

# Vertical range per channel (V)
# Format: channel_N_upper = value, channel_N_lower = value
channel_1_lower = -0.5
channel_1_upper = 3.0



[Measurement]
# Number of scope triggers to average
num_measurements = 1000

# Delay before trigger (seconds) - for timing alignment
trigger_delay = 0

# Cut/window for signal alignment (seconds)
cut_window = 230e-9


[Paths]
# Base output directory for results
output_dir = C:\pulse_shaping_data\optimisation_results

# Path to AWG configuration file (ConfigObj .ini format)
# Should contain [waveforms], [AWG], [TDC] sections
config_awg_path = .\configs\pulse_shaping_expt\awg_configs\feb26_optimisation_config.ini

# Optional: path to save optimized waveform (CSV format)
save_optimized_to = C:\pulse_shaping_data\optimisation_results\optimized_ch1_pump.csv





[Notes]
# Key differences from forward approach:
# - Inverted mode uses the response as "desired" input to NLMS
# - Finds the input waveform that would best explain the measured output
# - Window_step can be larger (search is more focused)
# 
# Typical optimal windows in previous experiments:
# - DLPro pump channel: window=16
# - EYLSA stokes channel: window=46
# - EYLSA pump channel: window=27
# - DLPro stokes channel: window=21
