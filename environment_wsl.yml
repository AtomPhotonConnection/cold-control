name: cold-control-wsl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  # Core Data Science
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.13.1
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - sympy=1.13.2
  - bottleneck=1.4.2
  - numexpr=2.10.1
  
  # Instrument Control & Hardware
  - pyvisa=1.14.1
  - pyvisa-py=0.7.2
  - pyserial=3.5
  - pyusb=1.3.1
  - libusb=1.0.28
  
  # GUI & Graphics
  - wxpython=4.2.1
  - pyqt=5.15.10
  - pillow=10.4.0
  
  # Utilities
  - requests=2.32.3
  - atom=0.9.0
  - configobj=5.0.6
  - decorator=5.1.1
  - ipython=8.15.0
  - ipykernel=6.29.5
  - pip=24.2
  
  # Pip specific dependencies
  - pip:
      - flexcache==0.3
      - flexparser==0.4
      - pint==0.24.4
      - platformdirs==4.3.6